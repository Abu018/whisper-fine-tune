trainer:
  max_epochs: 10
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  # exp_manager creates the logger and checkpoint callback itself.
  logger: false
  enable_checkpointing: false

model:
  train_ds:
    manifest_filepath: preproc_train.json
    sample_rate: 16000
    batch_size: 8
    shuffle: true
    num_workers: 0
    max_duration: 30.0
    min_duration: 0.2
  validation_ds:
    manifest_filepath: valid.json
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 0
  optim:
    name: adamw
    lr: 1.0e-4
    weight_decay: 0.001
    sched:
      name: CosineAnnealing
      warmup_ratio: 0.1
      min_lr: 1.0e-6

exp_manager:
  exp_dir: ./experiments
  name: hindi_asr_finetune
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    save_top_k: 3
    monitor: val_wer
    mode: min
model:
  train_ds:
    manifest_filepath: "./data/train.json"
    batch_size: 16
  test_ds:
    manifest_filepath: "./data/test.json"
    batch_size: 16
  tokenizer:
    update_tokenizer: false
  char_labels:
    update_labels: false
