[project]
name = "poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.2.0",
    "evaluate>=0.4.6",
    "jiwer>=4.0.0",
    "librosa>=1.0.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchcodec>=0.17.0",
    "transformers>=5.23.0",
]

[project.scripts]
poc = "poc:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
