[project]
name = "poc"
version = "0.1.0"
description = "Fine-tune AI4Bharat's Hindi IndicConformer (NeMo) on Kathbath"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "jiwer>=4.0.0",
    "lightning>=2.4.0",
    "nemo-toolkit[asr]>=3.0.0",
    "omegaconf>=2.3.0",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchcodec>=0.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
